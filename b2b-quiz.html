<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta property="og:title" content="AI 工具选型测试 — 90秒判断你该买提示词还是找顾问">

<style>
:root{--bg:#0a0a0f;--bg-card:#12121a;--border:#1f1f2e;--text:#e6e6f0;--muted:#8a8a9a;--accent:#6c4be0;--accent-2:#9b6cf0;--good:#4ade80;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:var(--accent-2);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:640px;margin:0 auto;padding:60px 24px 80px}
.back{color:var(--muted);font-size:.9rem;margin-bottom:32px;display:inline-block}
header{padding-bottom:32px;border-bottom:1px solid var(--border);margin-bottom:40px;text-align:center}
header h1{font-size:2rem;line-height:1.25;background:linear-gradient(135deg,#6c4be0,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--text);margin-top:14px;font-size:1.05rem}
header p.muted{color:var(--muted);margin-top:8px;font-size:.85rem}
.quiz-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:28px 24px;margin-bottom:20px}
.q-num{color:var(--accent-2);font-size:.8rem;font-weight:600;letter-spacing:1px;margin-bottom:8px}
.q-text{font-size:1.05rem;font-weight:500;margin-bottom:18px;line-height:1.5}
.q-options{display:grid;gap:10px}
.q-option{display:flex;align-items:center;padding:14px 16px;background:var(--bg);border:2px solid var(--border);border-radius:10px;cursor:pointer;font-size:.95rem;transition:border-color .15s,background .15s}
.q-option:hover{border-color:var(--accent-2)}
.q-option input{margin-right:12px;accent-color:var(--accent);transform:scale(1.2)}
.q-option label{cursor:pointer;flex:1;line-height:1.4}
.q-option:has(input:checked){border-color:var(--accent);background:rgba(108,75,224,.1)}
.progress-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;height:6px;margin-bottom:32px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s;border-radius:8px}
.result{background:linear-gradient(135deg,rgba(108,75,224,.12),rgba(192,132,252,.04));border:2px solid rgba(108,75,224,.5);border-radius:16px;padding:32px 28px;text-align:center;display:none}
.result.show{display:block}
.result-tier{font-size:2.5rem;margin-bottom:8px}
.result-title{font-size:1.4rem;font-weight:700;color:var(--accent-2);margin-bottom:10px}
.result-score{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.result-desc{color:var(--text);font-size:.95rem;line-height:1.6;text-align:left;margin-bottom:20px}
.result-desc strong{color:var(--accent-2)}
.result-next{background:var(--bg);border-radius:8px;padding:16px 18px;text-align:left;margin-bottom:20px}
.result-next h4{color:var(--accent-2);font-size:.9rem;margin-bottom:8px}
.result-next ul{margin-left:18px;color:var(--text);font-size:.88rem}
.result-next li{margin-bottom:5px}
.result-cta{display:inline-block;padding:14px 28px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white;border-radius:10px;font-weight:600;font-size:1rem;margin-bottom:10px}
.result-cta:hover{text-decoration:none;transform:translateY(-1px)}
.result-alt{display:block;margin-top:16px;font-size:.88rem;color:var(--muted)}
.tier-a{border-color:rgba(74,222,128,.4);background:linear-gradient(135deg,rgba(74,222,128,.08),rgba(74,222,128,.02))}
.tier-a .result-title{color:var(--good)}
.tier-b{border-color:rgba(255,181,71,.4)}
.tier-b .result-title{color:var(--warn)}
.cta-box{background:linear-gradient(135deg,rgba(108,75,224,.15),rgba(192,132,252,.06));border:1px solid rgba(108,75,224,.3);padding:24px;border-radius:12px;margin-top:32px;text-align:center}
.cta-box h3{color:#fff;margin-bottom:10px}
.cta-box p{color:var(--muted);font-size:.9rem}
.share-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.share-btn{padding:8px 16px;border-radius:8px;font-size:.85rem;font-weight:500;cursor:pointer;border:none;color:white;opacity:.85;transition:opacity .15s}
.share-btn:hover{opacity:1}
.share-btn.x{background:#000}.share-btn.linkedin{background:#0a66a2}.share-btn.copy{background:var(--bg-card);border:1px solid var(--border);color:var(--text)}
footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--border);color:var(--muted);font-size:.85rem;text-align:center}
@media(max-width:600px){.wrap{padding:40px 16px 60px}header h1{font-size:1.6rem}.quiz-card{padding:20px 16px}}
</style>
</head>
<body>
<div class="wrap">

<header>

<div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>

</footer>
</div>
<script>
const QUESTIONS=[
  {text:"你的团队有多少人每周处理重复性任务/文案？",options:[
    {label:"没怎么处理，全靠手速",value:0},
    {label:"3-5人知道用 AI，其他人不知道",value:1},
    {label:"6人以上，有清单流程",value:2}
  ]},
  {text:"你的公司目前对 AI 工具的集成程度？",options:[
    {label:"没怎么用，不知道怎么做",value:0},
    {label:"自己搭过，对比过市面方案",value:1},
    {label:"已经集成，业务流程深度定制",value:2}
  ]},
  {text:"每次文案产出平均需要多少时间投入？",options:[
    {label:"每次 1 小时相当于不花钱",value:0},
    {label:"1-3 小时，比招人便宜一点",value:1},
    {label:"3 小时以上，2个人的工作量",value:2}
  ]},
  {text:"如果 AI 能帮你省 50-70% 的时间，你担心的点是？",options:[
    {label:"用了 AI 生成的文案客户不接受",value:0},
    {label:"怎么保证 AI 生成质量稳定靠谱",value:1},
    {label:"怎么证明 ROI，以及老板审批问题",value:2}
  ]},
  {text:"你的公司规模和所处阶段是？",options:[
    {label:"一人公司，AI 只能帮你打下手",value:0},
    {label:"几个人小团队，AI 帮你扩大服务量",value:1},
    {label:"已经有一定规模，需要系统化运作",value:2}
  ]}
];
const TIERS=[
  {min:0,max:3,tier:"Tier A",title:"买 Prompt Pack，自己搞定",cssClass:"tier-a",scoreText:"你的得分：0-3 / 10",
   desc:"你还在"了解 AI 能做什么"的初级阶段。先买 prompt 为时过早，找 retainer 又太贵。你现在最需要<strong>试错和验证</strong>。",
   nextItems:["先拿 ¥75 的 Prompt Vault Master（160+ 条英双语 prompt）练手","把这些 prompt 用在 1-2 个日常场景（写邮件/发朋友圈）","通过 1 次实践后，再决定要不要系统化"],
   cta:"查看 Prompt Vault ($9.99)",ctaHref:"https://jiejuefuyou.gumroad.com/l/prompt-vault-master",
   alt:"或者，用 <a href='quote-calculator.html' style='color:var(--accent-2)'>报价计算器</a> 算一下你的真实 ROI 值多少钱"},
  {min:4,max:6,tier:"Tier B",title:"启动包 ¥99，搞定核心问题",cssClass:"tier-b",scoreText:"你的得分：4-6 / 10",
   desc:"你已经了解 AI，但缺少一个<strong>核心的方法论</strong>。需要一个30 分钟视频通案 + 1 份 PDF，帮你迈出第一步。ROI 明显。",
   nextItems:["拿 ¥99 启动包（含视频通案，原价 ¥499）","预约 30 分钟视频通话，搞定 7 个核心问题，算清 ROI","拿内部 PDF 开始 DIY，对比后找 retainer"],
   cta:"预约 30 min 咨询 (¥99)",ctaHref:"mailto:jiejuefuyou@gmail.com?subject=%E5%90%AF%E5%8A%A8%E5%8C%85%20%E2%80%94%20AI%20%E5%B7%A5%E4%BD%9C%E6%B5%81%E6%88%90%E7%86%B5%E6%B5%8B%E8%AF%84&body=Hi%20%E5%8D%B3%E5%86%B3%E5%AF%8C%E6%9C%89%EF%BC%8C%0A%0A%E6%88%91%E5%81%9A%E5%AE%8A%20AI%20%E5%B7%A5%E4%BD%9C%E6%B5%81%E6%88%90%E7%86%B5%E6%B5%8B%E8%AF%84%EF%BC%8C%E5%BE%97%E5%88%B0%20Tier%20B%20%E7%BB%93%E6%9E%9C%EF%BC%9A%E5%90%AF%E5%8A%A8%E5%8C%85%20%C2%A599%20%E6%91%B8%E5%BA%95%E3%80%82%0A%0A%E6%88%91%E5%9B%A2%E9%98%9F%E8%A7%84%E6%A8%A1%EF%BC%9A%5B%E4%BA%BA%E6%95%B0%5D%0A%E6%9C%AC%E5%9C%B0%E9%97%B4%E5%9C%B0%EF%BC%9A%5B%E5%85%B3%E4%BD%93%E5%9C%BA%E6%99%AF%5D%0A%0A%E5%B8%8C%E6%9C%9B%E7%9A%84%E6%91%B8%E5%BA%95%E6%97%B6%E6%AE%B5%EF%BC%9A%5B%E5%91%A8%E4%B8%80%E4%B8%8B%E5%8D%8814%3A00%5D%0A%0A%E8%B0%A2%E8%B0%A2",
   alt:"也可以用 <a href='roi-calculator.html' style='color:var(--accent-2)'>ROI 计算器</a> 算一下你的真实 ROI"},
  {min:7,max:10,tier:"Tier C",title:"上 Retainer，系统化提效",cssClass:"tier-c",scoreText:"你的得分：7-10 / 10",
   desc:"你已经<strong>准备好了</strong>。需要的是执行和方法论，先把预算定下来，知道 AI 能帮你干什么，然后找一个<strong>执行合伙人</strong>。从 0 到 1 最难的阶段已经过了。",
   nextItems:["直接预约 30 分钟通话（免费答疑，不收费）","预约一个完整诊断，了解你的真实 ROI","找一份报价单，搞清流程 + 时间框架 + 交付物"],
   cta:"30 min 诊断预约，直入主题",ctaHref:"mailto:jiejuefuyou@gmail.com?subject=30min%20%E6%91%B8%E5%BA%95%20%E2%80%94%20Tier%20C%20AI%20%E5%B7%A5%E4%BD%9C%E6%B5%81%E6%88%90%E7%86%B5%E6%B5%8B%E8%AF%84&body=Hi%20%E5%8D%B3%E5%86%B3%E5%AF%8C%E6%9C%89%EF%BC%8C%0A%0A%E6%88%91%E5%81%9A%E5%AE%8A%20AI%20%E5%B7%A5%E4%BD%9C%E6%B5%81%E6%88%90%E7%86%B5%E6%B5%8B%E8%AF%84%EF%BC%8C%E5%BE%97%E5%88%B0%20Tier%20C%20%E7%BB%93%E6%9E%9C%EF%BC%9A%E6%9C%89%E5%BF%85%E8%A6%81%E3%80%82%0A%0A%E6%88%91%E5%9B%A2%E9%98%9F%E8%A7%84%E6%A8%A1%EF%BC%9A%5B%E4%BA%BA%E6%95%B0%5D%0A%E6%9C%80%E6%83%B3%E8%A7%A3%E5%86%B3%E7%9A%84%E5%9C%BA%E6%99%AF%EF%BC%9A%5B%E5%AE%A2%E6%9C%8D%2F%E5%86%85%E5%AE%B9%2F%E6%8A%A5%E8%A1%A8%E2%80%A6%5D%0A%E9%A2%84%E7%AE%97%EF%BC%9A%5B%E5%85%83%5D%0A%0A%E6%88%91%E5%B8%8C%E6%9C%9B%E7%9A%8430%20min%20%E6%91%B8%E5%BA%95%E6%97%B6%E6%AE%B5%EF%BC%9A%5B%E5%91%A8%E4%B8%80%E4%B8%8B%E5%8D%8814%3A00%5D%0A%0A%E8%B0%A2%E8%B0%A2",
   alt:"也可以先拿 <a href='quote-calculator.html' style='color:var(--accent-2)'>报价计算器</a> 算出大概范围"}
];
let currentQ=0,answers=[];
function renderQuestion(){
  const q=QUESTIONS[currentQ];
  document.getElementById('progress').style.width=((currentQ/QUESTIONS.length)*100)+'%';
  document.getElementById('quiz').innerHTML='<div class="q-num">问题 '+(currentQ+1)+' / '+QUESTIONS.length+'</div><div class="q-text">'+q.text+'</div><div class="q-options">'+q.options.map((o,i)=>'<div class="q-option"><input type="radio" name="q'+currentQ+'" id="q'+currentQ+'_'+i+'" value="'+o.value+'" onchange="selectAnswer('+o.value+')"><label for="q'+currentQ+'_'+i+'">'+o.label+'</label></div>').join('')+'</div>';
  window.scrollTo({top:0,behavior:'smooth'});
}
function selectAnswer(v){answers[currentQ]=v;setTimeout(()=>{currentQ<QUESTIONS.length?renderQuestion():showResult()},300);}
function showResult(){
  document.getElementById('progress').style.width='100%';
  const total=answers.reduce((a,b)=>a+b,0);
  const t=TIERS.find(x=>total>=x.min&&total<=x.max);
  document.getElementById('quiz').style.display='none';
  const el=document.getElementById('result');
  el.className='result show '+t.cssClass;
  el.innerHTML='<div class="result-tier">'+t.tier+'</div><div class="result-title">'+t.title+'</div><div class="result-score">'+t.scoreText+'</div><div class="result-desc">'+t.desc+'</div><div class="result-next"><h4>下一步</h4><ul>'+t.nextItems.map(i=>'<li>'+i+'</li>').join('')+'</ul></div><a href="'+t.ctaHref+'" class="result-cta" target="_blank" rel="noopener">'+t.cta+'</a><span class="result-alt">'+t.alt+'</span>';
  document.getElementById('share-box').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function getResultText(){
  const total=answers.reduce((a,b)=>a+b,0);
  const t=TIERS.find(x=>total>=x.min&&total<=x.max);
  return 'AI工具选型测试结果：'+t.tier+' — '+t.title+' ('+t.scoreText+') | 免费测试：jiejuefuyou.github.io/b2b-quiz.html';
}
function copyResult(){
  navigator.clipboard.writeText(getResultText()).then(()=>{alert('已复制到剪贴板');});
}
function shareX(){
  const text=encodeURIComponent(getResultText());
  window.open('https://x.com/intent/tweet?text='+text,'_blank');
}
function shareLinkedIn(){
  const text=encodeURIComponent(getResultText());
  window.open('https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent('https://jiejuefuyou.github.io/b2b-quiz.html'),'_blank');
}
renderQuestion();
</script>
</body>
</html>

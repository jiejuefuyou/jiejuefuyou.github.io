# Jekyll config for GitHub Pages.
# We're not actually using Jekyll's templating — index.html and prompts.html are
# plain HTML and Pages serves them as-is. This file exists so Pages doesn't try
# to apply a default theme that would break the styling.

title: AutoApp
description: One AI agent. Four iPhone apps. Verifiable privacy.
theme: null
plugins: []

# Tell Pages not to process these as Jekyll
include: []
exclude:
  - README.md
  - gen_prompts_html.py
